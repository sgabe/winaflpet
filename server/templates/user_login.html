<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" type="text/css" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/static/css/fontawesome-all.min.css">
    <link rel="stylesheet" type="text/css" href="/static/css/custom.css">
    <title>Login | WinAFL Pet</title>
</head>
<body class="login text-center">
    <main role="main" class="container">
        <form id="login" method="POST" action="/user/login" class="form-signin" aria-label="Sign in" data-validation-summary>
            <svg class="brand-mark brand-big" viewBox="0 0 24 24" width="64" height="64" aria-hidden="true" focusable="false"><path d="M15.4 8.6c-1.8-1.8-4.6-1.7-6.3.2L3.4 19.5c-.5.9.2 1.6 1.1 1.1l10.7-5.7c1.9-1.7 2-4.5.2-6.3z" fill="#f97316" stroke="none"/><path d="M8.3 12.2l1.6 1.6M6.6 15.4l1.2 1.2M10.6 10.4l.9.9" stroke="#c2410c" stroke-width="1.2" stroke-linecap="round" fill="none"/><path d="M15.2 8.8 18.6 5.4M16.4 6.4c.3-2 1.8-3.6 3.9-3.8-.1 2-1.6 3.6-3.6 3.9M17.4 7.6c2-.4 3.6.4 4.4 1.8-1.6.9-3.3.9-4.6.1" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            <h1 class="h3 mb-3 font-weight-normal">WinAFL Pet</h1>
            <p class="login-subtitle">Sign in to manage your fuzzing jobs.</p>
            <div class="alert {{if .context}}{{if eq .context "empty"}}alert-empty{{else}}theme-{{.context}}{{end}}{{else}}alert-empty{{end}}" role="alert">
                <div class="message">{{.alert}}</div>
            </div>
            <div class="login-field">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" autocomplete="username" required autofocus>
            </div>
            <div class="login-field">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
            </div>
            <button class="btn theme-primary" type="submit">Sign in</button>
            <p class="mt-5 mb-3 text-muted">&copy; 2026 Gabor Seljan</p>
        </form>
    </main>
    <template id="tpl-form-validation-summary">
        <div class="form-notice form-validation-summary" role="alert" tabindex="-1" hidden></div>
    </template>
    <template id="tpl-form-validation-body"><h2 class="form-validation-heading"></h2><ul class="form-validation-list"></ul></template>
    <template id="tpl-form-validation-entry">
        <li><button type="button" class="form-validation-link"></button></li>
    </template>
    <script src="/static/js/jquery.min.js" type="text/javascript" charset="utf8"></script>
    <script src="/static/js/bootstrap.bundle.min.js" type="module" charset="utf8"></script>
    <script src="/static/js/custom.js" type="module" charset="utf8"></script>
</body>
</html>
