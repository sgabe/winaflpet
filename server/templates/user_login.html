<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" type="text/css" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/static/css/fontawesome-all.min.css">
    <link rel="stylesheet" type="text/css" href="/static/css/custom.css">
    <title>Login | WinAFL Pet</title>
</head>
<body class="login text-center">
    <main role="main" class="container">
        <form id="login" method="POST" action="/user/login" class="form-signin" data-validation-summary>
            <img class="mb-4" src="/static/svg/carrot-solid.svg" alt="" width="72" height="72">
            <h1 class="h3 mb-3 font-weight-normal">WinAFL Pet</h1>
            <p class="login-subtitle">Sign in to manage your fuzzing jobs.</p>
            <div class="alert {{if .context}}{{if eq .context "empty"}}alert-empty{{else}}theme-{{.context}}{{end}}{{else}}alert-empty{{end}}" role="alert">
                <div class="message">{{.alert}}</div>
            </div>
            <div class="login-field">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Username" autocomplete="username" required autofocus>
            </div>
            <div class="login-field">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Password" autocomplete="current-password" required>
            </div>
            <button class="btn theme-primary" type="submit">Sign in</button>
            <p class="mt-5 mb-3 text-muted">&copy; 2026 Gabor Seljan</p>
        </form>
    </main>
    <script src="/static/js/jquery.min.js" type="text/javascript" charset="utf8"></script>
    <script src="/static/js/bootstrap.bundle.min.js" type="module" charset="utf8"></script>
    <script src="/static/js/custom.js" type="module" charset="utf8"></script>
</body>
</html>
