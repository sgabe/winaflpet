{{define "content"}}
<div class="plot-toolbar">
  <a href="/jobs/view" id="plot-back-link">Back to jobs</a>
  <button type="button" id="plot-refresh" class="btn btn-outline theme-secondary">Refresh plot data</button>
</div>
<p id="plot-refresh-status" class="plot-refresh-status" role="status" aria-live="polite" hidden></p>
<div id="plots">
{{range .plots}}
  <figure class="plot-figure">
    <img src="{{.}}" class="plot img-fluid" alt="Generated fuzzing plot image">
    <figcaption><a href="{{.}}" target="_blank" rel="noopener">Open image</a></figcaption>
  </figure>
{{else}}
  <section class="empty-state" aria-labelledby="plot-empty-title">
    <h2 id="plot-empty-title">No plot images yet</h2>
    <p>Plot images appear once the instance has written plot data. Use Refresh plot data above to fetch it from the agent.</p>
  </section>
{{end}}
</div>
{{end}}
