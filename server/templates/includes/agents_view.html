{{define "content"}}
{{if not .agents}}
  <section class="empty-state" aria-labelledby="empty-agents-title">
    <h2 id="empty-agents-title">No agents yet</h2>
    <p>Register a Windows fuzzing machine to get started.</p>
    <div class="empty-state-actions">
      <a href="/agents/create" class="btn theme-primary">Add agent</a>
    </div>
  </section>
{{else}}
  <div id="cards" class="row row-cols-3">
    {{range .agents}}
    <div class="col sm:col-6 lg:col-4 mb-3">
      <div class="card agent">

        <div class="card-header card-summary">
          <button type="button" class="card-toggle collapsed" data-bs-toggle="collapse" data-bs-target="#collapse-{{ .ID }}" aria-expanded="false" aria-controls="collapse-{{ .ID }}">
            <span class="card-summary-title name" title="{{ .Name }}">{{ .Name }}</span>
            <span class="card-summary-badge {{if .Status}}is-enabled{{else}}is-disabled{{end}}">{{if .Status}}Enabled{{else}}Disabled{{end}}</span>
            <i class="fas fa-chevron-down card-summary-chevron" aria-hidden="true"></i>
            <span class="card-summary-meta">
              <small class="id {{if .Status}}on{{else}}off{{end}}">{{ .ID }}</small>
              <span class="card-summary-label" title="{{ .Host }}">{{ .Host }}</span>
            </span>
          </button>
        </div>

        <div id="collapse-{{ .ID }}" class="collapse collapsed">
          <div class="card-body">
            <p class="card-text truncate">{{ .Description }}</p>
            <dl class="card-details">
              <div class="card-detail"><dt>Host</dt><dd>{{ .Host }}</dd></div>
              <div class="card-detail"><dt>Port</dt><dd>{{ .Port }}</dd></div>
              <div class="card-detail"><dt>Version</dt><dd>{{ .Version }}</dd></div>
            </dl>
          </div>

          <div class="card-footer">
            <div class="card-actions">
            <a href="/agent/{{.GUID}}/check" class="btn btn-outline theme-secondary action check {{if (eq .Status 0) }}disabled{{end}}" data-method="POST">
              <svg class="bi" width="20" height="20" fill="currentColor" color="grey" viewBox="0 0 20 20" aria-hidden="true">
                <use xlink:href="/static/svg/bootstrap-icons.svg#check-circle-fill"/>
              </svg>
              <span>Check connection</span>
            </a>
            <a href="/agent/{{.GUID}}/edit" class="btn btn-outline theme-secondary action edit">
              <svg class="bi" width="20" height="20" fill="currentColor" color="brown" viewBox="0 0 20 20" aria-hidden="true">
                <use xlink:href="/static/svg/bootstrap-icons.svg#pencil"/>
              </svg>
              <span>Edit</span>
            </a>
            <a href="/agent/{{.GUID}}" class="btn btn-outline theme-secondary action delete" data-method="DELETE" data-confirm-title="Delete agent?" data-confirm-message="Delete agent “{{.Name}}” ({{.Host}}:{{.Port}}) from WinAFL Pet? This can't be undone.">
              <svg class="bi" width="20" height="20" fill="currentColor" color="red" viewBox="0 0 20 20" aria-hidden="true">
                <use xlink:href="/static/svg/bootstrap-icons.svg#trash-fill"/>
              </svg>
              <span>Delete</span>
            </a>
            </div>
          </div>
        </div>
      </div>
    </div>
    {{end}}
  </div>
{{end}}
{{end}}
