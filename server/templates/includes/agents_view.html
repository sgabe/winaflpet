{{define "content"}}
{{if not .agents}}
  <p>There are no existing agents in the database. Click <a href="/agents/create">here</a> to create one!</p>
{{else}}
  <div id="cards" class="row row-cols-3">
    {{range .agents}}
    <div class="col sm:col-6 lg:col-4 mb-3">
      <div class="card agent">

        <div class="card-header card-summary">
          <button type="button" class="card-toggle collapsed" data-bs-toggle="collapse" data-bs-target="#collapse-{{ .ID }}" aria-expanded="false" aria-controls="collapse-{{ .ID }}">
            <span class="card-summary-title name" title="{{ .Name }}">{{ .Name }}</span>
            <span class="card-summary-badge {{if .Status}}is-enabled{{else}}is-disabled{{end}}">{{if .Status}}Enabled{{else}}Disabled{{end}}</span>
            <i class="fas fa-chevron-down card-summary-chevron" aria-hidden="true"></i>
            <span class="card-summary-meta">
              <small class="id {{if .Status}}on{{else}}off{{end}}">{{ .ID }}</small>
              <span class="card-summary-label" title="{{ .Host }}">{{ .Host }}</span>
            </span>
          </button>
        </div>

        <div id="collapse-{{ .ID }}" class="collapse collapsed">
          <div class="card-body">
            <p class="card-text truncate">{{ .Description }}</p>
            <ul class="list-group list-group-flush">
              <li class="list-group-item"><h6>Host</h6> <small class="text-body-secondary float-end">{{ .Host }}</small></li>
              <li class="list-group-item"><h6>Port</h6> <small class="text-body-secondary float-end">{{ .Port }}</small></li>
              <li class="list-group-item"><h6>Version</h6> <small class="text-body-secondary float-end">{{ .Version }}</small></li>
            </ul>
          </div>

          <div class="card-footer">
            <div class="btn-group">
            <a href="/agent/{{.GUID}}/check" class="btn btn-outline theme-secondary action check {{if (eq .Status 0) }}disabled{{end}}" data-method="POST">
              <svg class="bi" width="20" height="20" fill="currentColor" color="grey" viewBox="0 0 20 20">
                <use xlink:href="/static/svg/bootstrap-icons.svg#check-circle-fill"/>
              </svg>
            </a>
            <a href="/agent/{{.GUID}}/edit" class="btn btn-outline theme-secondary action edit">
              <svg class="bi" width="20" height="20" fill="currentColor" color="brown" viewBox="0 0 20 20">
                <use xlink:href="/static/svg/bootstrap-icons.svg#pencil"/>
              </svg>
            </a>
            <a href="/agent/{{.GUID}}" class="btn btn-outline theme-secondary action delete" data-method="DELETE">
              <svg class="bi" width="20" height="20" fill="currentColor" color="red" viewBox="0 0 20 20">
                <use xlink:href="/static/svg/bootstrap-icons.svg#trash-fill"/>
              </svg>
            </a>
            </div>
          </div>
        </div>
      </div>
    </div>
    {{end}}
  </div>
{{end}}
{{end}}
