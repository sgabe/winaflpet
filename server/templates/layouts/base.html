<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" type="text/css" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/static/css/fontawesome-all.min.css">
    <link rel="stylesheet" type="text/css" href="/static/css/custom.css">
    <title>{{if .title}}{{.title}}{{else}}Home{{end}} | WinAFL Pet</title>
    <script defer src="/static/js/bootstrap.bundle.min.js" type="module" charset="utf8"></script>
</head>
<body>
    <nav class="navbar md:navbar-expand navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-carrot d-inline-block"></i>
                WinAFL Pet
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar" aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbar">
                <ul class="nav navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link {{ if isActive .path "/" }}active{{ end }}" aria-current="{{ isActive .path "/"}}" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <button type="button" class="nav-link" id="dropdown01" data-bs-toggle="menu" aria-expanded="false">Agents</button>
                        <div class="menu" aria-labelledby="dropdown01">
                            <a class="menu-item {{ if isActive .path "/agents/create" }}active{{ end }}" aria-current="{{ isActive .path "/agents/create"}}" href="/agents/create">Create</a>
                            <a class="menu-item {{ if isActive .path "/agents/view" }}active{{ end }}" aria-current="{{ isActive .path "/agents/view"}}" href="/agents/view">View</a>
                        </div>
                    </li>
                    <li class="nav-item">
                        <button type="button" class="nav-link" id="dropdown02" data-bs-toggle="menu" aria-expanded="false">Jobs</button>
                        <div class="menu" aria-labelledby="dropdown02">
                            <a class="menu-item {{ if isActive .path "/jobs/create" }}active{{ end }}" aria-current="{{ isActive .path "/jobs/create"}}" href="/jobs/create">Create</a>
                            <a class="menu-item {{ if isActive .path "/jobs/upload" }}active{{ end }}" aria-current="{{ isActive .path "/jobs/upload"}}" href="/jobs/upload">Upload</a>
                            <a class="menu-item {{ if isActive .path "/jobs/view" }}active{{ end }}" aria-current="{{ isActive .path "/jobs/view"}}" href="/jobs/view">View</a>
                        </div>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ if isActive .path "/crashes/view" }}active{{ end }}" aria-current="{{ isActive .path "/crashes/view"}}" href="/crashes/view">Crashes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ if isActive .path "/settings" }}active{{ end }}" href="/settings">Settings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{ if isActive .path "/user/edit" }}active{{ end }}" aria-current="{{ isActive .path "/user/edit"}}" href="/user/edit">Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/user/logout">
                            <i class="fas fa-sign-out-alt"></i>
                        </a>
                    </li>
                </ul>
            </div>
            <form class="form-inline ml-auto" role="search">
                <input type="search" class="form-control" placeholder="Search" aria-label="Search" id="search">
            </form>
        </div>
    </nav>
    <main role="main" class="container">
    {{if .title}}<h1>{{.title}}</h1>{{end}}
    <div id="alert" class="alert {{if .context}}{{if eq .context "empty"}}alert-empty{{else}}theme-{{.context}}{{end}}{{else}}alert-empty{{end}} alert-dismissible fade show" role="alert">
        <div class="message">{{.alert}}</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close">
            <span aria-hidden="true" class="visually-hidden">&times;</span>
        </button>
    </div>
    <div id="wait" class="d-flex justify-content-center">
        <div class="spinner-border" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    {{template "content" .}}
    </main>
    <footer class="footer">
      <div class="container">
        <p class="float-start text-muted text-left copyright"><small>&copy; 2026 Gabor Seljan</small></p>
        <p class="float-end text-muted text-right version"><small>{{ getVersion }}</small></p>
      </div>
    </footer>
    <script src="/static/js/jquery.min.js" type="text/javascript" charset="utf8"></script>
    <script src="/static/js/jquery-succinct-min.js" type="text/javascript" charset="utf8"></script>
    <script src="/static/js/masonry.pkgd.min.js" type="text/javascript" charset="utf8"></script>
    <script src="/static/js/custom.js" type="module" charset="utf8"></script>
    <script src="/static/js/lifecycle.js"></script>
</body>
</html>
